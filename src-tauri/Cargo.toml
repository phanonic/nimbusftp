[package]
name = "nimbusftp"
version = "2.0.3"
description = "Nimbus FTP - modern FTP/FTPS/SFTP client"
authors = ["Nimbus"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
suppaftp = { version = "13", features = ["tokio-async-native-tls", "deprecated"] }
ssh2 = "0.9"
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
hex = "0.4"
trash = "5"
opener = "0.7"
rfd = "0.15"
winreg = "0.56"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
