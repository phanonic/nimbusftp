<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ipc: http://ipc.localhost; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: asset:">
<title>NimbusFTP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c9bff"/><stop offset="1" stop-color="#37d9c8"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#g)"/><path d="M7.5 22.5a4.2 4.2 0 0 1-.4-8.38A5.8 5.8 0 0 1 18 12.2a4.2 4.2 0 0 1 .6 10.3H7.5z" fill="#fff"/><path d="M12.5 18.8v-4.2M10.8 16.2l1.7-1.7 1.7 1.7" stroke="#1b3a6b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.5 14.6v4.2M17.8 17.1l1.7 1.7 1.7-1.7" stroke="#1b3a6b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>NimbusFTP</span>
    </div>
    <button class="btn" id="btn-sites"></button>
    <form class="quick" id="quick" autocomplete="off">
      <select id="q-proto" title="Protokol">
        <option value="ftp">FTP</option>
        <option value="ftpes">FTPES (açık TLS)</option>
        <option value="ftps">FTPS (örtük TLS)</option>
        <option value="sftp">SFTP (SSH)</option>
      </select>
      <input id="q-host" placeholder="Sunucu  (örn. ftp.ornek.com)" spellcheck="false">
      <input id="q-port" class="port" placeholder="Port" inputmode="numeric">
      <input id="q-user" placeholder="Kullanıcı" spellcheck="false">
      <input id="q-pass" type="password" placeholder="Parola">
      <button class="btn primary" id="q-go" type="submit">Bağlan</button>
    </form>
    <button class="btn icon" id="btn-theme" title="Temayı değiştir"></button>
  </header>

  <main class="panes">
    <section class="pane" id="pane-local"></section>
    <section class="pane" id="pane-remote"></section>
  </main>

  <div class="splitter" id="splitter" title="Boyutlandır"></div>

  <section class="bottom" id="bottom">
    <div class="tabs">
      <button class="tab active" data-tab="transfers">Aktarımlar <span class="badge" id="tr-badge">0</span></button>
      <button class="tab" data-tab="log">Günlük</button>
      <div class="grow"></div>
      <span class="summary" id="tr-summary"></span>
      <button class="btn sm" id="tr-cancel">Tümünü iptal et</button>
      <button class="btn sm" id="tr-clear">Bitenleri temizle</button>
    </div>
    <div class="tabpane" id="tab-transfers"><div class="tbl-wrap"><table class="tr-table"><thead><tr><th style="width:42px"></th><th>Dosya</th><th style="width:90px">Boyut</th><th style="width:230px">İlerleme</th><th style="width:90px">Hız</th><th style="width:150px">Durum</th><th style="width:70px"></th></tr></thead><tbody id="tr-body"></tbody></table><div class="empty" id="tr-empty">Aktarım kuyruğu boş. Dosyaları bir panelden diğerine sürükleyin veya F5'e basın.</div></div></div>
    <div class="tabpane hidden" id="tab-log"><pre id="log"></pre></div>
  </section>

  <footer class="status"><span id="st-left">Hazır</span><span class="grow"></span><span id="st-right">NimbusFTP</span></footer>
</div>
<div id="overlay" class="hidden"></div>
<div id="ctx" class="hidden"></div>
<div id="toasts"></div>
<script type="module" src="/entry.js"></script>
</body>
</html>
