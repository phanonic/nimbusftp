<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ipc: http://ipc.localhost; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: asset:">
<title>NimbusFTP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c9bff"/><stop offset="1" stop-color="#37d9c8"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#g)"/><g fill="#fff"><circle cx="15" cy="14" r="5.5"/><circle cx="9.5" cy="17" r="4"/><circle cx="21.5" cy="16.5" r="4.5"/><rect x="6" y="16" width="20" height="6" rx="3"/></g><path d="M13.5 19v-5M11.5 16l2-2 2 2" stroke="#1b3a6b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.5 13v5M17.5 16l2 2 2-2" stroke="#1b3a6b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>NimbusFTP</span>
    </div>
    <button class="btn" id="btn-sites"></button>
    <button class="btn icon" id="btn-settings" data-i18n-title="settings"></button>
    <form class="quick" id="quick" autocomplete="off">
      <select id="q-proto" data-i18n-title="protocol">
        <option value="ftp">FTP</option>
        <option value="ftpes" data-i18n="ftpExplicit">FTPES (açık TLS)</option>
        <option value="ftps" data-i18n="ftpImplicit">FTPS (örtük TLS)</option>
        <option value="sftp">SFTP (SSH)</option>
      </select>
      <input id="q-host" data-i18n-placeholder="serverPlaceholder" placeholder="Sunucu  (örn. ftp.ornek.com)" spellcheck="false">
      <input id="q-port" class="port" data-i18n-placeholder="port" placeholder="Port" inputmode="numeric">
      <input id="q-user" data-i18n-placeholder="user" placeholder="Kullanıcı" spellcheck="false">
      <input id="q-pass" type="password" data-i18n-placeholder="password" placeholder="Parola">
      <label class="quick-chk"><input type="checkbox" id="q-auto"><span data-i18n="autoConnect"></span></label>
      <button class="btn primary" id="q-go" type="submit" data-i18n="connect">Bağlan</button>
    </form>
    <select id="lang" data-i18n-title="language">
      <option value="tr">Türkçe</option>
      <option value="en">English</option>
    </select>
    <button class="btn icon" id="btn-theme" data-i18n-title="theme"></button>
  </header>

  <main class="panes">
    <section class="pane" id="pane-local"></section>
    <section class="pane" id="pane-remote"></section>
  </main>

  <div class="splitter" id="splitter" data-i18n-title="resize"></div>

  <section class="bottom" id="bottom">
    <div class="tabs">
      <button class="tab active" data-tab="transfers"><span data-i18n="transfers">Aktarımlar</span> <span class="badge" id="tr-badge">0</span></button>
      <button class="tab" data-tab="log" data-i18n="log">Günlük</button>
      <div class="grow"></div>
      <span class="summary" id="tr-summary"></span>
      <button class="btn sm" id="tr-cancel" data-i18n="cancelAll">Tümünü iptal et</button>
      <button class="btn sm" id="tr-clear" data-i18n="clearDone">Bitenleri temizle</button>
    </div>
    <div class="tabpane" id="tab-transfers"><div class="tbl-wrap"><table class="tr-table"><thead><tr><th style="width:42px"></th><th data-i18n="file">Dosya</th><th style="width:90px" data-i18n="size">Boyut</th><th style="width:230px" data-i18n="progress">İlerleme</th><th style="width:90px" data-i18n="speed">Hız</th><th style="width:150px" data-i18n="status">Durum</th><th style="width:70px"></th></tr></thead><tbody id="tr-body"></tbody></table><div class="empty" id="tr-empty" data-i18n="emptyTransfers">Aktarım kuyruğu boş. Dosyaları bir panelden diğerine sürükleyin veya F5'e basın.</div></div></div>
    <div class="tabpane hidden" id="tab-log"><pre id="log"></pre></div>
  </section>

  <footer class="status"><span id="st-left" data-i18n="ready">Hazır</span><span class="grow"></span><span id="st-right">NimbusFTP</span></footer>
</div>
<div id="overlay" class="hidden"></div>
<div id="ctx" class="hidden"></div>
<div id="toasts"></div>
<script type="module" src="/entry.js"></script>
</body>
</html>
